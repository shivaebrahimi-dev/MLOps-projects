name: fashion-mlops

services:
  # S3-compatible object storage for trained models.
  # MinIO no longer publishes minio/minio on Docker Hub, so this uses the Chainguard build.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env (copy .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env (copy .env.example)}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Experiment tracking server: run metadata in SQLite, artifacts on a volume.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Local stand-in for a real webhook consumer: prints every payload it receives.
  # Read them with `docker compose logs webhook-receiver`.
  webhook-receiver:
    image: python:3.12-slim
    command: python -u /app/webhook_receiver.py 8080
    volumes:
      - ./scripts/webhook_receiver.py:/app/webhook_receiver.py:ro
    ports:
      - "${WEBHOOK_PORT:-8090}:8080"

volumes:
  minio-data:
  mlflow-data:
