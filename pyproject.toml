[project]
name = "fashion-mlops"
version = "0.1.0"
description = "Train, track, store and serve a LeNet-5 Fashion-MNIST classifier (MLflow, MinIO, FastAPI, Streamlit)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Shiva Hajiebrahimi", email = "shiva.hajiebrahimi@gmail.com" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

# Each service installs only the extra it needs, which keeps the Docker images small.
[project.optional-dependencies]
train = [
    "minio>=7.2",
    "mlflow-skinny>=3.1",
    "numpy>=2.0",
    "pillow>=10.3",
    "torch>=2.4",
    "torchvision>=0.19",
]
api = [
    "fastapi>=0.115",
    "minio>=7.2",
    "numpy>=2.0",
    "pillow>=10.3",
    "python-multipart>=0.0.9",
    "torch>=2.4",
    "uvicorn>=0.30",
]
ui = [
    "streamlit>=1.38",
]

[project.scripts]
fashion-train = "fashion_mlops.train:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_mlops"]

# CPU-only PyTorch wheels: no GPU is needed for LeNet-5 and the images stay far smaller.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
