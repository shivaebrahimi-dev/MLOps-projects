[project]
name = "zeroshot-mlops"
version = "0.1.0"
description = "Zero-shot text classification platform with model management and MinIO storage"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".specify", ".claude", "specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Pages add the project root to the import path before importing the app.
"app/streamlit_app.py" = ["E402"]
"app/pages/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires a running MinIO server",
]
