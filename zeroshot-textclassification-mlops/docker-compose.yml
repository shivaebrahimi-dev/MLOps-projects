services:
  minio:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2025.7.23-debian-12-r5}
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-console:
    image: ${MINIO_CONSOLE_IMAGE:-bitnamilegacy/minio-object-browser:2.0.2-debian-12-r4}
    command: ["server"]
    ports:
      - "127.0.0.1:9001:9090"
    environment:
      CONSOLE_MINIO_SERVER: http://minio:9000
    depends_on:
      minio:
        condition: service_healthy

  # Optional. Start it with: docker compose --profile app up -d --build
  app:
    profiles: ["app"]
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-zeroshot-learning-output}
      MODEL_DIR: /app/models
      HF_HOME: /app/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    volumes:
      - app_models:/app/models
      - app_cache:/app/.cache
      - ./configs:/app/configs
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio_data:
  app_models:
  app_cache:
